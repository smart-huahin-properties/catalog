<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoCo Master - Smart Hybrid Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-4 text-slate-800">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-8 mt-6">
        <h2 class="text-2xl font-bold text-center mb-6">🚀 ระบบจัดการรูปภาพ</h2>
        
        <div class="flex gap-2 mb-8 bg-slate-100 p-1.5 rounded-2xl">
            <button onclick="switchMode('new')" id="tabNew" class="flex-1 py-3 rounded-xl font-bold bg-white shadow-sm text-blue-600 transition-all">➕ เพิ่มใหม่</button>
            <button onclick="switchMode('edit')" id="tabEdit" class="flex-1 py-3 rounded-xl font-bold text-slate-500 transition-all">✏️ แก้ไขเดิม</button>
        </div>

        <div id="sectionNew" class="mb-6">
            <label class="block font-semibold mb-2 ml-1">รหัสบ้านใหม่ (Auto-Run):</label>
            <input type="text" id="hpIdNew" readonly class="w-full p-4 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl font-bold text-blue-600 outline-none text-center">
        </div>

        <div id="sectionEdit" class="hidden mb-6">
            <label class="block font-semibold mb-2 ml-1">เลือกบ้านที่จะเพิ่มรูป/แก้ไข:</label>
            <select id="hpIdEdit" class="w-full p-4 bg-white border-2 border-slate-200 rounded-2xl outline-none focus:border-blue-500 appearance-none">
                <option value="">กำลังโหลดรายการ...</option>
            </select>
        </div>

        <div class="mb-8">
            <label class="block font-semibold mb-2 ml-1 text-sm">เลือกรูปภาพ (รูปแรก = หน้าปก)</label>
            <input type="file" id="fileInput" multiple accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700">
        </div>

        <div id="statusBox" class="hidden mb-6 p-4 rounded-2xl text-center text-sm"></div>

        <button onclick="handleUpload()" id="uploadBtn" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-bold text-lg shadow-lg hover:bg-blue-700 transition-all">
            ยืนยันการดำเนินการ
        </button>
    </div>

    <script>
        // 🛑 อย่าลืมวาง URL ของคุณตรงนี้ครับ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxLP6N5B4xJNpIMET1xnU4kTI69DiaTNECfLC0JpI9yKgyvN2P6as9VuasemBeq0A_o/exec"; 
        let currentMode = 'new';

        window.onload = loadData;

        async function loadData() {
            try {
                // ดึงเลขใหม่
                const resNext = await fetch(WEB_APP_URL);
                document.getElementById('hpIdNew').value = await resNext.text();
                // ดึงรายการเดิม
                const resList = await fetch(WEB_APP_URL + "?mode=list");
                const ids = await resList.json();
                const select = document.getElementById('hpIdEdit');
                select.innerHTML = ids.map(id => `<option value="${id}">${id}</option>`).join('');
            } catch (e) { console.error("Load failed"); }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('sectionNew').classList.toggle('hidden', mode === 'edit');
            document.getElementById('sectionEdit').classList.toggle('hidden', mode === 'new');
            document.getElementById('tabNew').className = mode === 'new' ? "flex-1 py-3 rounded-xl font-bold bg-white shadow-sm text-blue-600" : "flex-1 py-3 rounded-xl font-bold text-slate-500";
            document.getElementById('tabEdit').className = mode === 'edit' ? "flex-1 py-3 rounded-xl font-bold bg-white shadow-sm text-blue-600" : "flex-1 py-3 rounded-xl font-bold text-slate-500";
        }

        async function handleUpload() {
            const hpId = currentMode === 'new' ? document.getElementById('hpIdNew').value : document.getElementById('hpIdEdit').value;
            // ... (โค้ดส่งข้อมูล fetch POST เหมือนเดิม)
        }
    </script>
</body>
</html>
