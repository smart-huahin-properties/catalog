<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoCo Uploader V2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-[2.5rem] shadow-2xl p-8 mt-6">
        <h2 class="text-2xl font-bold text-center mb-6 text-slate-700">📸 จัดการรูปภาพ</h2>
        
        <div class="flex gap-2 mb-6 bg-slate-100 p-1.5 rounded-2xl text-sm">
            <button onclick="switchMode('new')" id="tabNew" class="flex-1 py-3 rounded-xl font-bold bg-white shadow-sm text-blue-600 transition-all">➕ เพิ่มใหม่</button>
            <button onclick="switchMode('edit')" id="tabEdit" class="flex-1 py-3 rounded-xl font-bold text-slate-500 transition-all">✏️ แก้ไขเดิม</button>
        </div>

        <div id="sectionNew" class="mb-4">
            <input type="text" id="hpIdNew" readonly class="w-full p-3 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl font-bold text-blue-600 text-center outline-none">
        </div>
        <div id="sectionEdit" class="hidden mb-4">
            <select id="hpIdEdit" class="w-full p-3 bg-white border-2 border-slate-200 rounded-xl outline-none focus:border-blue-500 appearance-none"></select>
        </div>

        <div class="space-y-4 my-6">
            <label class="block p-4 bg-blue-50 border-2 border-blue-200 border-dashed rounded-2xl cursor-pointer text-center">
                <span id="labelThumb" class="text-blue-600 font-bold">🖼️ เลือกรูปหน้าปก (1 รูป)</span>
                <input type="file" id="inputThumb" accept="image/*" class="hidden" onchange="updateLabel('thumb')">
            </label>
            <label class="block p-4 bg-emerald-50 border-2 border-emerald-200 border-dashed rounded-2xl cursor-pointer text-center">
                <span id="labelGallery" class="text-emerald-600 font-bold">📂 เลือกรูปอัลบั้ม (ไม่เกิน 15)</span>
                <input type="file" id="inputGallery" multiple accept="image/*" class="hidden" onchange="updateLabel('gallery')">
            </label>
        </div>

        <div id="statusBox" class="hidden mb-6 p-4 rounded-2xl text-center text-xs font-bold"></div>

        <button onclick="handleUpload()" id="uploadBtn" class="w-full bg-slate-800 text-white py-5 rounded-2xl font-bold text-lg active:scale-95 transition-all">ยืนยันการบันทึก</button>
    </div>

    <script>
        // 🛑 สำคัญ: วาง URL ที่ได้จาก Deploy รายการใหม่ของคุณที่นี่
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxQ0JXaz0-wKDpTExzoqfLWDf2bo4fKCJcdxJ6shN9idwKBWfOGeJYE6iOfVYypaX3K/exec"; 
        let currentMode = 'new';

        window.onload = loadData;

        async function loadData() {
            try {
                const resNext = await fetch(WEB_APP_URL);
                document.getElementById('hpIdNew').value = await resNext.text();
                const resList = await fetch(WEB_APP_URL + "?mode=list");
                const ids = await resList.json();
                document.getElementById('hpIdEdit').innerHTML = ids.map(id => `<option value="${id}">${id}</option>`).join('');
            } catch (e) { console.error("Load failed"); }
        }

        function updateLabel(type) {
            const files = document.getElementById(type === 'thumb' ? 'inputThumb' : 'inputGallery').files;
            document.getElementById(type === 'thumb' ? 'labelThumb' : 'labelGallery').innerText = files.length > 0 ? `✅ เลือกแล้ว ${files.length} รูป` : (type === 'thumb' ? '🖼️ เลือกรูปหน้าปก (1 รูป)' : '📂 เลือกรูปอัลบั้ม (ไม่เกิน 15)');
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('sectionNew').classList.toggle('hidden', mode === 'edit');
            document.getElementById('sectionEdit').classList.toggle('hidden', mode === 'new');
            document.getElementById('tabNew').className = mode === 'new' ? "flex-1 py-3 rounded-xl font-bold bg-white shadow-sm text-blue-600" : "flex-1 py-3 rounded-xl font-bold text-slate-500";
            document.getElementById('tabEdit').className = mode === 'edit' ? "flex-1 py-3 rounded-xl font-bold bg-white shadow-sm text-blue-600" : "flex-1 py-3 rounded-xl font-bold text-slate-500";
        }

        async function handleUpload() {
            const hpId = currentMode === 'new' ? document.getElementById('hpIdNew').value : document.getElementById('hpIdEdit').value;
            const thumb = document.getElementById('inputThumb').files;
            const gall = document.getElementById('inputGallery').files;
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('statusBox');

            if (thumb.length === 0 && gall.length === 0) return alert("กรุณาเลือกรูปภาพ!");

            btn.disabled = true;
            status.classList.remove('hidden');
            status.className = "mb-6 p-4 rounded-2xl text-center bg-blue-50 text-blue-600 animate-pulse";
            status.innerText = "กำลังประมวลผลข้อมูล...";

            try {
                const filesData = [];
                if (thumb.length > 0) filesData.push({ name: "t_" + thumb[0].name, type: thumb[0].type, base64: (await toB64(thumb[0])).split(',')[1], isThumb: true });
                for (let f of gall) filesData.push({ name: f.name, type: f.type, base64: (await toB64(f)).split(',')[1], isThumb: false });

                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ hpId: hpId, files: filesData }) });
                status.className = "mb-6 p-4 rounded-2xl text-center bg-green-50 text-green-600";
                status.innerText = "✅ บันทึกและ Sync สำเร็จ!";
                setTimeout(() => location.reload(), 2000);
            } catch (e) {
                status.className = "mb-6 p-4 rounded-2xl text-center bg-red-50 text-red-600";
                status.innerText = "❌ ผิดพลาด: " + e.message;
                btn.disabled = false;
            }
        }

        function toB64(f) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); }); }
    </script>
</body>
</html>
