<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Properties Catalog | CoCo Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .property-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
    </style>
</head>
<body>

    <header class="bg-blue-900 text-white py-8 shadow-lg">
        <div class="container mx-auto text-center">
            <h1 class="text-3xl font-bold">SMART PROPERTIES CATALOG</h1>
            <p class="mt-2 text-blue-200">CoCo Hua Hin 88 Luxury Home Project</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10">
        <div id="loading" class="text-center text-gray-600">กำลังโหลดข้อมูลโครงการ...</div>
        
        <div id="property-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <script>
        // 1. วาง URL Web App ที่ได้จาก Google Apps Script ที่นี่
        const webAppUrl = "https://script.google.com/macros/s/AKfycbw0raXufzgR0roEtFNnhHTmJRCRuQAdxC320U_BEv7M5McssWhulPXstEfuS_NQ8sMU/exec";

        async function fetchProperties() {
            try {
                const response = await fetch(`${webAppUrl}?action=getPublicCatalog`);
                const result = await response.json();
                
                if (result.status === "success") {
                    displayProperties(result.data);
                } else {
                    document.getElementById('loading').innerText = "ไม่สามารถโหลดข้อมูลได้: " + result.message;
                }
            } catch (error) {
                document.getElementById('loading').innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
                console.error(error);
            }
        }

        function displayProperties(properties) {
            const grid = document.getElementById('property-grid');
            const loader = document.getElementById('loading');
            loader.style.display = 'none';
            grid.innerHTML = '';

            properties.forEach(item => {
                const card = `
                    <div class="property-card bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
                        <div class="relative">
                            <img src="${item.Thumbnail_Image || 'https://via.placeholder.com/400x250'}" class="w-full h-56 object-cover" alt="${item.ID_NAME}">
                            <span class="absolute top-4 right-4 bg-orange-500 text-white px-3 py-1 rounded-full text-sm font-semibold shadow">
                                ${item.Badge || 'NEW'}
                            </span>
                        </div>
                        <div class="p-6">
                            <div class="flex justify-between items-start mb-2">
                                <h2 class="text-xl font-bold text-gray-800">${item.HP_ID} - ${item.ID_NAME}</h2>
                                <span class="text-blue-600 font-bold text-lg">฿${Number(item.Price).toLocaleString()}</span>
                            </div>
                            <p class="text-gray-500 text-sm mb-4 line-clamp-2">${item.Description}</p>
                            
                            <div class="grid grid-cols-3 gap-2 border-t border-b py-3 mb-4 text-center text-sm text-gray-600">
                                <div><span class="block font-bold">${item.Bedrooms}</span> นอน</div>
                                <div><span class="block font-bold">${item.Bathrooms}</span> น้ำ</div>
                                <div><span class="block font-bold">${item["Living Area (sq.m)"]}</span> ตร.ม.</div>
                            </div>

                            <div class="flex gap-2">
                                <a href="${item.FBLink}" target="_blank" class="flex-1 bg-blue-600 text-white text-center py-2 rounded-lg hover:bg-blue-700 transition">Facebook</a>
                                <button onclick="alert('ID: ${item.HP_ID}\\nPlot: ${item.Plot}')" class="flex-1 border border-blue-600 text-blue-600 py-2 rounded-lg hover:bg-blue-50 transition">รายละเอียด</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // เริ่มทำงานเมื่อเปิดหน้าเว็บ
        fetchProperties();
    </script>
</body>
</html>
